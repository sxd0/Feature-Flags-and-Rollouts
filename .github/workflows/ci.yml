name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install

      - name: Ruff
        run: |
          poetry run ruff format --check .
          poetry run ruff check .

      - name: Mypy
        run: poetry run mypy services libs tests

      - name: Pytest
        run: poetry run pytest
